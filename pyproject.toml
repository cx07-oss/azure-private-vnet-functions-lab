[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["functions/producer", "functions/worker"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
branch = true
source = ["functions/producer", "functions/worker"]
